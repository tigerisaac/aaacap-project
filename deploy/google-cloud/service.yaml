# DECLINED COST PROPOSAL. Do not deploy; retained only as an explanatory reference.
# Not a deployed service. IMAGE_DIGEST intentionally remains unresolved.
# Costed initial pilot: always-on CPU, one instance, managed PostgreSQL.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shield-api
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/cloudsql-instances: shield-calls-isaac:us-central1:shield-postgres
    spec:
      serviceAccountName: shield-runtime@shield-calls-isaac.iam.gserviceaccount.com
      containerConcurrency: 10
      timeoutSeconds: 15
      containers:
        - image: us-central1-docker.pkg.dev/shield-calls-isaac/shield/backend@sha256:IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
          env:
            - { name: NODE_ENV, value: production }
            - { name: SHIELD_MODE, value: live }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PUBLIC_BASE_URL, value: 'https://shield-calls-isaac.web.app' }
            - { name: AUTH_PROVIDER, value: firebase }
            - { name: FIREBASE_PROJECT_ID, value: shield-calls-isaac }
            - { name: SCREENING_PROVIDER, value: openrouter }
            - { name: OPENROUTER_MODEL, value: google/gemini-3.7-flash }
            - { name: MODEL_TIMEOUT_MS, value: '5000' }
            - { name: LIVE_OFFERING_ENABLED, value: 'false' }
            - { name: SMS_CLASSIFICATION_ENABLED, value: 'false' }
            - { name: APPLE_TEAM_ID, value: 6R6HMW3DWN }
            - { name: IOS_BUNDLE_ID, value: org.isaaczhang.Shield }
            - { name: APNS_PRODUCTION, value: 'false' }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: shield-database-url, key: '1' } }
            - name: DATA_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: shield-data-encryption-key, key: '1' } }
            - name: TWILIO_ACCOUNT_SID
              valueFrom: { secretKeyRef: { name: shield-twilio-account-sid, key: '1' } }
            - name: TWILIO_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: shield-twilio-auth-token, key: '1' } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: shield-openrouter-api-key, key: '1' } }
            - name: FIREBASE_WEB_API_KEY
              valueFrom: { secretKeyRef: { name: shield-firebase-web-api-key, key: '1' } }
